<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f9">
  <title>峰哥出品 - 应用导航</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #17233b;
      background: #f4f6f9;
    }
    main { max-width: 720px; margin: 0 auto; padding: 64px 20px; }
    h1 { margin: 0 0 12px; font-size: 2rem; }
    p { line-height: 1.6; }
    .intro { margin: 0 0 32px; color: #56657a; }
    nav { display: grid; gap: 16px; }
    .card {
      display: block;
      padding: 24px;
      border: 1px solid #dce4ef;
      border-radius: 16px;
      color: inherit;
      background: #fff;
      text-decoration: none;
    }
    .card:hover { border-color: #1e6fd9; }
    .card:focus-visible { outline: 3px solid #1e6fd9; outline-offset: 3px; }
    .card h2 { margin: 0 0 8px; font-size: 1.25rem; }
    .card p { margin: 0; color: #56657a; }
  </style>
</head>
<body>
  <main>
    <h1>峰哥出品</h1>
    <p class="intro">选择一个应用开始使用。</p>
    <nav aria-label="应用导航">
      <a class="card" href="./CarKeeper/">
        <h2>爱车记录</h2>
        <p>记录汽车保养和加油信息，支持离线使用。</p>
      </a>
      <a class="card" href="./WaterMarkApp/">
        <h2>照片水印</h2>
        <p>在设备上为照片添加文字水印。</p>
      </a>
    </nav>
  </main>
</body>
</html>
